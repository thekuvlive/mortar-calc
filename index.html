<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mortar Calc</title>
<meta name="theme-color" content="#15171a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mortar Calc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow fire-control panel, base row, target row, big range readout, shot log below */
:root{
  --bg:#15171a; --panel:#1e2125; --line:#33383e; --fg:#e4e2da; --muted:#8d9089;
  --accent:#e0b44c; --ok:#7fbf6a; --bad:#e2664f;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--mono);-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.06em;text-transform:uppercase;margin:0;display:flex;justify-content:space-between;align-items:baseline}
h1 small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.08em}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:64px 1fr 1fr;gap:8px;align-items:end}
.tag{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-bottom:12px}
.tag.t{color:var(--accent)}
label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;min-width:0}
input[type=text]{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:3px;padding:10px;width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.readout{text-align:center;padding:18px 8px 14px;border-top:1px solid var(--line)}
.range{font-family:var(--display);font-weight:800;font-size:76px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ok)}
.range.over{color:var(--bad)}
.range.idle{color:var(--line)}
.range span{font-size:28px;margin-left:4px;color:var(--muted)}
.sub{margin-top:8px;font-size:13px;color:var(--muted);min-height:1.2em}
.sub b{color:var(--bad);font-weight:600}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg);text-transform:none;letter-spacing:0;flex-direction:row;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.btns{display:flex;gap:8px}
button{font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:14px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:3px;padding:10px 12px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.log h2{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.log ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.log li{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding:6px 0;border-bottom:1px solid var(--line)}
.log li strong{color:var(--fg);font-weight:600}
.log li strong.over{color:var(--bad)}
.hint{font-size:11px;color:var(--muted);line-height:1.5;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Mortar Calc <small>GRID × 100 = METERS</small></h1>

  <div class="panel">
    <div class="row">
      <div class="tag">Base</div>
      <label for="bx">X<input id="bx" type="text" inputmode="decimal" autocomplete="off" value="84.71"></label>
      <label for="by">Y<input id="by" type="text" inputmode="decimal" autocomplete="off" value="71.15"></label>
    </div>
    <div class="row">
      <div class="tag t">Target</div>
      <label for="tx">X<input id="tx" type="text" inputmode="decimal" autocomplete="off" value="79.39"></label>
      <label for="ty">Y<input id="ty" type="text" inputmode="decimal" autocomplete="off" value="68.74"></label>
    </div>

    <div class="readout">
      <div class="range" id="range">0<span>m</span></div>
      <div class="sub" id="sub"></div>
    </div>

    <div class="controls">
      <label class="toggle" for="tank"><input id="tank" type="checkbox"> In tank (no 700 m cap)</label>
      <div class="btns">
        <button id="log-btn" type="button">Log shot</button>
        <button id="new-btn" type="button">New target</button>
      </div>
    </div>
    <p class="hint">Enter jumps to the next box. Paste a pair like "84.71x 71.15y" into an X box and it splits itself, even if Y comes first. Base is remembered.</p>
  </div>

  <div class="panel log">
    <h2>Shot log</h2>
    <ol id="log"><li><span>Example: 84.71, 71.15 → 79.39, 68.74</span><strong>584 m</strong></li></ol>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const ids=["bx","by","tx","ty"];
const CAP=700;
let exampleRow=true;

function num(v){const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null}

function calc(){
  const [bx,by,tx,ty]=ids.map(i=>num($(i).value));
  const r=$("range"),s=$("sub");
  if([bx,by,tx,ty].some(v=>v===null)){r.className="range idle";r.innerHTML="---<span>m</span>";s.textContent="Fill all four boxes";return null}
  const m=Math.hypot(tx-bx,ty-by)*100;
  const over=!$("tank").checked&&m>CAP;
  r.className="range"+(over?" over":"");
  r.innerHTML=Math.round(m).toLocaleString()+"<span>m</span>";
  s.innerHTML=over?`<b>${Math.round(m-CAP)} m past the 700 cap.</b> Close the gap or use the tank.`:`Exact ${m.toFixed(1)} m`+(m<100?" · danger close":"");
  return {m,over,bx,by,tx,ty};
}

function save(){try{localStorage.setItem("mortar-base",JSON.stringify({bx:$("bx").value,by:$("by").value,tank:$("tank").checked}))}catch(e){}}
try{const b=JSON.parse(localStorage.getItem("mortar-base")||"null");if(b){$("bx").value=b.bx;$("by").value=b.by;$("tank").checked=!!b.tank}}catch(e){}

// Paste a pair into an X box. Honors x/y labels, so "59.22y 100.35x" lands correctly.
function splitPair(text){
  const parts=[...String(text).matchAll(/(-?\d+(?:[.,]\d+)?)\s*([xy])?/gi)].map(m=>({v:m[1].replace(",","."),l:(m[2]||"").toLowerCase()}));
  if(parts.length<2)return null;
  const [a,b]=parts;
  if(a.l==="y"||b.l==="x")return {x:b.v,y:a.v};
  return {x:a.v,y:b.v};
}
[["bx","by"],["tx","ty"]].forEach(([x,y])=>{
  $(x).addEventListener("input",()=>{
    const p=splitPair($(x).value);
    if(p){$(x).value=p.x;$(y).value=p.y;$(y).focus();calc();save()}
  });
});

ids.forEach((id,i)=>{
  $(id).addEventListener("input",()=>{calc();save()});
  $(id).addEventListener("focus",e=>e.target.select());
  $(id).addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();
      if(i<3)$(ids[i+1]).focus();else{logShot();$("tx").focus()}}
  });
});
$("tank").addEventListener("change",()=>{calc();save()});

function logShot(){
  const c=calc();if(!c)return;
  const ol=$("log");
  if(exampleRow){ol.innerHTML="";exampleRow=false}
  const li=document.createElement("li");
  li.innerHTML=`<span>${c.bx}, ${c.by} → ${c.tx}, ${c.ty}</span><strong class="${c.over?"over":""}">${Math.round(c.m).toLocaleString()} m</strong>`;
  ol.prepend(li);
  while(ol.children.length>12)ol.lastChild.remove();
}
$("log-btn").addEventListener("click",logShot);
$("new-btn").addEventListener("click",()=>{$("tx").value="";$("ty").value="";calc();$("tx").focus()});

calc();

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
